name: ZeeT AI Cloud APK Builder
run-name: ZeeT APK ${{ inputs.build_id }}

on:
  workflow_dispatch:
    inputs:
      build_id:
        description: ZeeT build id
        required: true
        type: string
      source_url:
        description: Signed ZeeT source endpoint
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      BUILD_ID: ${{ inputs.build_id }}
      SOURCE_URL: ${{ inputs.source_url }}

    steps:
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Download ZeeT source
        env:
          ZEET_RUNNER_KEY: ${{ secrets.ZEET_RUNNER_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            -H "Authorization: Bearer ${ZEET_RUNNER_KEY}" \
            "${SOURCE_URL}" -o source.zip
          mkdir project
          unzip -q source.zip -d project

      - name: Prepare Android 35
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Build debug APK
        working-directory: project
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --max-workers=2 assembleDebug
          APK="$(find app/build/outputs/apk -type f -name '*.apk' | head -n 1)"
          test -n "${APK}"
          cp "${APK}" ../zeet-result.apk

      - name: Return APK directly to ZeeT AI
        env:
          ZEET_RUNNER_KEY: ${{ secrets.ZEET_RUNNER_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          BASE_URL="${SOURCE_URL%%/api/apk-source/*}"
          curl --fail-with-body --silent --show-error \
            -X PUT \
            -H "Authorization: Bearer ${ZEET_RUNNER_KEY}" \
            -H "Content-Type: application/vnd.android.package-archive" \
            --data-binary @zeet-result.apk \
            "${BASE_URL}/api/apk-build-upload/${BUILD_ID}"

      - name: Report failure
        if: failure()
        env:
          ZEET_RUNNER_KEY: ${{ secrets.ZEET_RUNNER_KEY }}
        shell: bash
        run: |
          BASE_URL="${SOURCE_URL%%/api/apk-source/*}"
          curl --silent --show-error \
            -X POST \
            -H "Authorization: Bearer ${ZEET_RUNNER_KEY}" \
            -H "Content-Type: application/json" \
            --data '{"error":"Cloud APK Runner gagal mengompilasi project. ZeeT AI menyimpan source ZIP agar bisa diperbaiki dan dicoba ulang."}' \
            "${BASE_URL}/api/apk-build-fail/${BUILD_ID}" || true
